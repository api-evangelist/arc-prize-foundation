problem_types:
- status: 400
  title: Bad request
  applies_to:
  - resetGame
  - action1
  - action2
  - action3
  - action4
  - action5
  - action6
  - action7
  remediation: >-
    Verify game_id is known and well-formed, guid corresponds to an active
