- status: 401
  title: Missing or invalid X-API-Key header
  applies_to: all
  remediation: Supply a valid X-API-Key header; register a key at https://arcprize.org/platform.
- status: 404
  title: Scorecard not found
  applies_to:
  - closeScorecard
  - getScorecard
  - getScorecardForGame
  remediation: >-
    Ensure card_id corresponds to an open or closed scorecard (and, for the
    per-game endpoint, that it contains an entry for the specified game_id).
- status: 429
  title: Rate limit exceeded
  code: RATE_LIMIT_EXCEEDED
  applies_to: all
  remediation: >-
    Stay under 600 requests per minute. Contact team@arcprize.org (subject
    "Increase Rate Limits") for higher throughput.
