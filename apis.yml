aid: arc-prize-foundation
name: Arc Prize Foundation
description: >-
  The ARC Prize Foundation is a nonprofit advancing open artificial general
  intelligence research through scientifically rigorous benchmarks and
  competitive prizes. Its ARC-AGI benchmark series measures fluid intelligence
  on tasks that are easy for humans but hard for AI, and its ARC-AGI-3
  Interactive Reasoning Benchmark exposes a public REST API (three.arcprize.org)
  plus an open-source Python toolkit and SDK for building agents that play,
  score, and generalize across novel game environments. The Foundation runs the
  ARC Prize competitions in partnership with Kaggle, with participation from
  OpenAI, Google, xAI, Anthropic, and NIST.
